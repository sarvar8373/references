{% extends "base.html" %} {% block main %}
<header class="site-header d-flex flex-column justify-content-center align-items-center">
  <div class="container">
      <div class="row align-items-center">

          <div class="col-lg-5 col-12">
              <nav aria-label="breadcrumb">
                  <ol class="breadcrumb">
                      <li class="breadcrumb-item"><a href="{% url 'references_app' %}">Homepage</a></li>

                      <li class="breadcrumb-item active" aria-current="page">Login</li>
                  </ol>
              </nav>

              <h2 class="text-white">Login</h2>
          </div>

      </div>
  </div>
</header>
<section class="d-flex justify-content-center py-5 topics-detail-section section-padding section-bg" id="topics-detail">

  <div id="menu-1" class="w-25 homepage home-section text-center py-4 custom-block bg-white shadow-lg">
    <div class="welcome-text">
      <h3 class="mb-4"><strong>Login</strong></h3>
      {% if msg %}
      <div class="alert alert-danger mx-auto col-md-4" role="alert">
        {{ msg | safe }}
      </div>
      {% endif %}
      <div class="d-flex justify-content-center mt-3">
        <form method="post" class="w-100" style="max-width: 400px;">
          {% csrf_token %}
          <div class="mb-3">
            <label for="inputEmail3" class="form-label float-start">Foydalanuvchi nomi</label>
            {{ form.username }}
          </div>
          <div class="mb-3">
            <label for="inputPassword3" class="form-label float-start">Parol</label>
            {{ form.password }}
          </div>
          <div class="mb-3 form-check">
            <input
                type="checkbox"
                class="form-check-input"
                id="remember_me"
                name="remember_me"
            />
            <label class="form-check-label float-start" for="remember_me">Eslab qolish</label>
            <a class="float-end" href="{% url 'register' %}">Royhatdan o'tish</a>
          </div>
          <button type="submit" class="btn btn-success w-100" style="background-image: linear-gradient(15deg, #13547a 0%, #80d0c7 100%);">Login</button>
        </form>
      </div>
    </div>
  </div>
  
</div></section>
{% endblock main %}
