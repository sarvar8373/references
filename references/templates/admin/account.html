{% extends "./bases.html" %} {% block main %}{% load static %} {% load i18n %}
<div class="content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-8">
        <div class="card">
          <div class="card-header">
            <h4 class="card-title">Profil</h4>
          </div>
          <div class="card-body">
            <form>
              <div class="row">
                <div class="col-md-5 pr-1">
                  <div class="form-group">
                    <label>Roli</label>
                    <input
                      type="text"
                      class="form-control"
                      disabled=""
                      placeholder=" {% if is_admin %}
                      Admin
                  {% elif is_user %}
                      User
                  {% else %}
                      Unknown
                  {% endif %}"
                      value=" {% if is_admin %}
                      Admin
                  {% elif is_user %}
                      User
                  {% else %}
                      Unknown
                  {% endif %}"
                    />
                  </div>
                </div>
                <div class="col-md-3 px-1">
                  <div class="form-group">
                    <label>Foydalanuvchi nomi</label>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="{{ username }}"
                      value="{{ username }}"
                    />
                  </div>
                </div>
                <div class="col-md-4 pl-1">
                  <div class="form-group">
                    <label for="exampleInputEmail1">Elektron pochtasi</label>
                    <input
                      type="email"
                      class="form-control"
                      placeholder="{{ email }}"
                      value="{{ email }}"
                    />
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 pr-1">
                  <div class="form-group">
                    <label>Ismi</label>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="Company"
                      value="{{ first_name }}"
                    />
                  </div>
                </div>
                <div class="col-md-6 pl-1">
                  <div class="form-group">
                    <label>Familiyasi</label>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="{{ last_name }}"
                      value="{{ last_name }}"
                    />
                  </div>
                </div>
              </div>

              <button type="submit" class="btn btn-info btn-fill pull-right">
                Update Profile
              </button>
              <div class="clearfix"></div>
            </form>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card card-user">
          {% comment %}
          <div class="card-image">
            <img
              src="https://ununsplash.imgix.net/photo-1431578500526-4d9613015464?fit=crop&fm=jpg&h=300&q=75&w=400"
              alt="..."
            />
          </div>
          {% endcomment %}
          <div class="card-body">
            <div class="author">
              <a href="#">
                <img
                  class="avatar border-gray"
                  src="{% static 'images/sidebar-2.jpg' %}"
                  alt="..."
                />
                <h5 class="title">{{ first_name }} {{ last_name }}</h5>
              </a>
              <p class="description">{{ username }}</p>
            </div>
            <p class="description text-center"></p>
          </div>
          <hr />
          <div class="button-container mr-auto ml-auto">
            <button href="#" class="btn btn-simple btn-link btn-icon">
              <i class="fa fa-facebook-square"></i>
            </button>
            <button href="#" class="btn btn-simple btn-link btn-icon">
              <i class="fa fa-twitter"></i>
            </button>
            <button href="#" class="btn btn-simple btn-link btn-icon">
              <i class="fa fa-google-plus-square"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock main %}
