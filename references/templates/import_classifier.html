<!-- import_classifier.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Import Classifier Data</title>
  </head>
  <body>
    <h1>Import Classifier Data</h1>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <input type="file" name="file" accept=".xlsx, .xls" />
      <button type="submit">Upload Excel File</button>
    </form>
  </body>
</html>
